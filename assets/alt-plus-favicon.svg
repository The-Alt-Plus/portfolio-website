    <circle cx="54" cy="38" r="2"/>
    <circle cx="38" cy="46" r="2"/>
    <circle cx="46" cy="46" r="2"/>
    <circle cx="54" cy="46" r="2"/>
    <circle cx="38" cy="54" r="2"/>
    <circle cx="46" cy="54" r="2"/>
    <circle cx="54" cy="54" r="2"/>
  </g>
</svg>
