<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE ALT+ · Dual-Viewport Acoustic &amp; Ring Artifact Viewer</title>
  <link rel="icon" type="image/svg+xml" href="assets/alt-plus-favicon.svg" />
  <!-- Google model-viewer v4.4.0 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg-canvas: #121214;
      --bg-panel-left: #56585c;
      --bg-panel-right: #0d0e11;
      --hud-bg: rgba(18, 18, 22, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --accent-vermilion: #e04f33;
      --text-primary: #f2f2f5;
      --text-secondary: #a2a4ac;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Asymmetric Two-Window Split Grid matching Notion / Exhibition Layout */
    .split-viewport-grid {
      display: grid;
      grid-template-columns: 2.15fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1640px;
      height: calc(100vh - 48px);
      min-height: 540px;
      max-height: 860px;
    }

    .viewport-window {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    /* Window 01: Landscape Urban Acoustic Map */
    .window-map {
      background-color: var(--bg-panel-left);
    }

    /* Window 02: Portrait Parametric Ring Artifact */
    .window-ring {
      background-color: var(--bg-panel-right);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: var(--accent-vermilion);
    }

    /* Top-Left Architectural HUD */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      pointer-events: none;
      background: var(--hud-bg);
      backdrop-filter: blur(8px);
      border-left: 2px solid var(--accent-vermilion);
      padding: 10px 14px;
    }

    .hud-header h1 {
      font-size: 11px;
      letter-spacing: 0.14em;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
    }

    .hud-header p {
      font-size: 9px;
      color: var(--text-secondary);
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Top-Left Audio Channels Rack (Below HUD Header) */
    .channels-hud {
      position: absolute;
      top: 82px;
      left: 18px;
      width: 284px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }

    .channels-hud-title {
      background: var(--hud-bg);
      backdrop-filter: blur(8px);
      border: 1px solid #2a2a32;
      border-left: 2px solid var(--accent-vermilion);
      padding: 6px 10px;
      font-size: 8.5px;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .channels-hud-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hud-mini-btn {
      background: rgba(24, 24, 30, 0.95);
      border: 1px solid #34343e;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 8px;
      letter-spacing: 0.08em;
      padding: 3px 7px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .hud-mini-btn:hover,
    .hud-mini-btn.active {
      border-color: var(--accent-vermilion);
      color: #ffffff;
      background: rgba(224, 79, 51, 0.2);
    }

    .channel-load-btn {
      background: rgba(28, 28, 36, 0.95);
      border: 1px solid #3a3a46;
      color: #d4d4dc;
      font-family: inherit;
      font-size: 7.5px;
      letter-spacing: 0.08em;
      padding: 3px 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .channel-load-btn:hover,
    .channel-card.has-audio .channel-load-btn {
      border-color: var(--accent-vermilion);
      color: #ffffff;
    }

    .channel-card.has-audio .channel-sub {
      color: #e4e4ec;
    }

    .channels-hud-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-card {
      position: relative;
      background: rgba(14, 14, 18, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .channel-card:hover,
    .channel-card.hover-link,
    .channel-card.active {
      border-color: var(--accent-vermilion);
      background: rgba(34, 16, 14, 0.92);
      transform: translateX(2px);
    }

    .channel-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .channel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-vermilion);
      flex-shrink: 0;
    }

    .channel-card.active .channel-dot {
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
    }

    .channel-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .channel-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
    }

    .channel-sub {
      font-size: 8px;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .channel-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Mini Animated Spectrum Equalizer Bars */
    .channel-eq {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .eq-bar {
      width: 2px;
      height: 3px;
      background: #52525b;
      transition: height 0.15s ease, background 0.2s ease;
    }

    @keyframes eqBounce {
      0%, 100% { height: 3px; }
      50% { height: 12px; }
    }

    .channel-card.active .eq-bar {
      background: var(--accent-vermilion);
      animation: eqBounce 0.55s ease-in-out infinite;
    }

    .channel-card.active .eq-bar:nth-child(2) { animation-delay: 0.12s; }
    .channel-card.active .eq-bar:nth-child(3) { animation-delay: 0.27s; }
    .channel-card.active .eq-bar:nth-child(4) { animation-delay: 0.08s; }
    .channel-card.active .eq-bar:nth-child(5) { animation-delay: 0.21s; }

    .channel-state {
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      min-width: 26px;
      text-align: right;
    }

    .channel-card.active .channel-state {
      color: #ff8c75;
      font-weight: 600;
    }

    /* Right-edge anchor terminal where the SVG wire attaches to the channel card */
    .channel-port {
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #18181c;
      border: 1.5px solid var(--accent-vermilion);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .channel-card:hover .channel-port,
    .channel-card.hover-link .channel-port,
    .channel-card.active .channel-port {
      background: #ffffff;
      border-color: var(--accent-vermilion);
      box-shadow: 0 0 8px var(--accent-vermilion);
      transform: translateY(-50%) scale(1.2);
    }

    /* SVG Connector Wires from HUD Channel Cards to 3D Hotspots */
    .hud-wire-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1px;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .hud-wire-flow {
      fill: none;
      stroke: rgba(224, 79, 51, 0.55);
      stroke-width: 1.2px;
      stroke-dasharray: 4 10;
      stroke-linecap: round;
      animation: stemPulseUp 1.1s linear infinite;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .stem-group.active .hud-wire-track {
      stroke: rgba(224, 79, 51, 0.55);
      stroke-width: 1.5px;
    }

    .stem-group.active .hud-wire-flow {
      stroke: #ff8c75;
      stroke-width: 2.2px;
      stroke-dasharray: 6 8;
      animation-duration: 0.5s;
    }

    /* Visibility Toggle for HUD-to-Hotspot Connection Wires */
    .hide-hud-links .hud-wire-track,
    .hide-hud-links .hud-wire-flow,
    .stem-group.wire-hidden .hud-wire-track,
    .stem-group.wire-hidden .hud-wire-flow {
      opacity: 0;
      visibility: hidden;
    }

    .hide-hud-links .channel-port,
    .channel-card.wire-hidden .channel-port {
      border-color: #52525b;
      background: #121216;
      box-shadow: none;
      opacity: 0.45;
    }

    /* Top-Right Mode / Sync Indicators */
    .window-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }

    .badge-btn {
      background: var(--hud-bg);
      border: 1px solid #2e2e36;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 7px 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .badge-btn:hover,
    .badge-btn.active {
      border-color: var(--accent-vermilion);
      color: #ffffff;
      background: rgba(224, 79, 51, 0.18);
    }

    /* 3D Spatial Audio Hotspot Pins */
    .hotspot {
      background: rgba(12, 12, 16, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .hotspot:hover,
    .hotspot.active {
      background: var(--accent-vermilion);
      border-color: #ff8c75;
      transform: scale(1.08);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-vermilion);
    }

    .hotspot.active .pulse-dot {
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
    }

    /* Invisible 3D ground-point anchor used to project vertical stem base */
    .hotspot-base-anchor {
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 2D/3D Projected SVG Overlay for Animated Hotspot Positioning Lines */
    .hotspot-lines-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    @keyframes stemPulseUp {
      from {
        stroke-dashoffset: 28;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    .stem-track {
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1.2px;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .stem-flow {
      stroke: var(--accent-vermilion);
      stroke-width: 1.8px;
      stroke-dasharray: 5 9;
      stroke-linecap: round;
      animation: stemPulseUp 0.9s linear infinite;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .stem-group.active .stem-track {
      stroke: rgba(224, 79, 51, 0.55);
      stroke-width: 1.8px;
    }

    .stem-group.active .stem-flow {
      stroke: #ff8c75;
      stroke-width: 2.6px;
      stroke-dasharray: 6 8;
      animation-duration: 0.45s;
    }

    .stem-packet {
      fill: #ff7a5c;
      filter: drop-shadow(0 0 5px #e04f33);
    }

    .stem-group.active .stem-packet {
      fill: #ffffff;
      filter: drop-shadow(0 0 8px #ffffff);
    }

    .stem-base-dot {
      fill: var(--accent-vermilion);
    }

    .stem-base-ring {
      fill: none;
      stroke: var(--accent-vermilion);
      stroke-width: 1.2px;
      opacity: 0.65;
    }

    /* Bottom Telemetry / Instruction Strip */
    .hud-footer {
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .telemetry-pill {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 1px solid #2a2a32;
      padding: 7px 12px;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #d4d4dc;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .action-btn {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 1px solid #383842;
      color: #ffffff;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 7px 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--accent-vermilion);
    }

    #stop-audio-btn {
      display: none;
      padding: 2px 7px;
      font-size: 8px;
    }

    /* Hidden Local File Inputs for Student Live Preview */
    input[type="file"] {
      display: none;
    }

    /* Responsive Collapse for Mobile / Narrow Notion Columns */
    @media (max-width: 960px) {
      body {
        padding: 12px;
      }

      .split-viewport-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 55vh 55vh;
        height: auto;
        max-height: none;
      }
    }
  </style>
</head>

<body>

  <main class="split-viewport-grid">
    <!-- ===================================================================
         WINDOW 01: LANDSCAPE URBAN ACOUSTIC TOPOLOGY (LEFT PANEL)
         =================================================================== -->
    <section class="viewport-window window-map">
      <div class="hud-header" style="pointer-events: auto;">
        <a href="alt-plus.html" style="display:inline-block;margin-bottom:6px;font-size:10px;letter-spacing:0.12em;color:#e04f33;text-decoration:none;text-transform:uppercase;">← BACK TO THE ALT+</a>
        <h1 id="team-title">THE ALT+ · ACOUSTIC &amp; RING VISUALIZER</h1>
        <p id="team-subtitle">URBAN ACOUSTIC TOPOLOGY &amp; PARAMETRIC ARTIFACT</p>
      </div>

      <!-- Top-Left Dynamic Audio Channels Rack (Linked to 3D Hotspots) -->
      <div class="channels-hud" id="channels-hud">
        <div class="channels-hud-title">
          <span>AUDIO CHANNELS · <strong id="channels-count-badge">0 CH</strong></span>
          <div class="channels-hud-actions">
            <label class="hud-mini-btn" for="upload-batch-audio" title="Load audio files (.mp3, .wav) into channels">+ AUDIO</label>
            <input type="file" id="upload-batch-audio" accept="audio/*" multiple />
            <button type="button" class="hud-mini-btn active" id="toggle-links-btn" title="Show or hide connection lines to hotspots">LINKS: ON</button>
          </div>
        </div>
        <div class="channels-hud-list" id="channels-hud-list"></div>
      </div>

      <div class="window-controls">
        <button class="badge-btn active" id="focus-map-btn">01 · AREA MAP</button>
        <label class="badge-btn" for="upload-map-glb" title="Preview local .glb in browser">LOAD MAP .GLB</label>
        <input type="file" id="upload-map-glb" accept=".glb,.gltf" />
      </div>

      <model-viewer id="mv-map" src="assets/models/example_berlin.glb"
        alt="Tokyo Urban District Massing and Street Network" camera-controls touch-action="pan-y"
        camera-orbit="35deg 58deg 105%" min-camera-orbit="auto 15deg auto" max-camera-orbit="auto 85deg auto"
        tone-mapping="neutral" shadow-intensity="1.2" shadow-softness="0.8" exposure="1.05" environment-image="neutral">
        <!-- Hotspots are created dynamically on load from triangular meshes named CH1, CH2, ... in the .glb -->
      </model-viewer>

      <!-- Animated SVG Leader Lines connecting 3D street bases to 3D CH# hotspots -->
      <svg id="hotspot-lines-svg" class="hotspot-lines-svg"></svg>

      <div class="hud-footer">
        <div class="telemetry-pill">
          <span id="status-readout">DRAG TO ORBIT · SCANNING .GLB FOR CH# ANCHOR MESHES...</span>
          <button class="action-btn" id="stop-audio-btn">STOP</button>
        </div>
        <button class="action-btn" id="reset-map-cam">RESET VIEW</button>
      </div>
    </section>

    <!-- ===================================================================
         WINDOW 02: PORTRAIT PARAMETRIC RING ARTIFACT (RIGHT PANEL)
         =================================================================== -->
    <section class="viewport-window window-ring">
      <div class="window-controls">
        <button class="badge-btn active" id="focus-ring-btn">02 · RING ARTIFACT</button>
        <label class="badge-btn" for="upload-ring-glb" title="Preview local ring .glb in browser">LOAD RING .GLB</label>
        <input type="file" id="upload-ring-glb" accept=".glb,.gltf" />
      </div>

      <model-viewer id="mv-ring" src="assets/models/Ring_00.glb" alt="Generative MultiPipe Silver Ring Artifact" ar
        ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" auto-rotate
        auto-rotate-delay="1500" rotation-per-second="18deg" camera-orbit="25deg 72deg 115%" tone-mapping="neutral"
        shadow-intensity="1.4" exposure="1.15" environment-image="neutral">

        <button slot="ar-button" class="action-btn" style="position:absolute; bottom:18px; right:18px;">
          VIEW IN AR
        </button>
      </model-viewer>

      <div class="hud-footer">
        <div class="telemetry-pill">
          <span>SUBD MULTIPIPE · 3D PRINTED METAL</span>
        </div>
      </div>
    </section>
  </main>

  <audio id="audio-engine" preload="auto"></audio>

  <script>
    const mvMap = document.getElementById('mv-map');
    const mvRing = document.getElementById('mv-ring');
    const windowMapEl = mvMap.closest('.window-map');
    const linesSvg = document.getElementById('hotspot-lines-svg');
    const channelsHudList = document.getElementById('channels-hud-list');
    const channelsCountBadge = document.getElementById('channels-count-badge');
    const toggleLinksBtn = document.getElementById('toggle-links-btn');
    const uploadBatchAudioInput = document.getElementById('upload-batch-audio');
    const audioEngine = document.getElementById('audio-engine');
    const statusReadout = document.getElementById('status-readout');
    const stopAudioBtn = document.getElementById('stop-audio-btn');
    const SVG_NS = 'http://www.w3.org/2000/svg';

    let hotspots = [];
    let stemRecords = [];
    let animFrameId = null;
    let loadStartTime = 0;
    let areLinksVisible = true;
    let defaultIdleText = 'DRAG TO ORBIT · CLICK CH# PIN TO AUDITION STREAM';

    // Persistent map of user-loaded audio files by channel number: chNum -> { url, name }
    const loadedAudioByChannel = new Map();

    // 1. Multi-Team URL Query Parameter Support (?team=team-01)
    const params = new URLSearchParams(window.location.search);
    const teamParam = params.get('team');
    if (teamParam) {
      const formattedTeam = teamParam.replace('-', ' ').toUpperCase();
      document.getElementById('team-title').textContent = `CITY INTELLIGENCE TOKYO · ${formattedTeam}`;
      mvMap.src = `assets/teams/${teamParam}/map.glb`;
      mvRing.src = `assets/teams/${teamParam}/ring.glb`;
    }

    // Toggle visibility of all HUD-to-Hotspot connection wires
    toggleLinksBtn.addEventListener('click', () => {
      areLinksVisible = !areLinksVisible;
      windowMapEl.classList.toggle('hide-hud-links', !areLinksVisible);
      toggleLinksBtn.classList.toggle('active', areLinksVisible);
      toggleLinksBtn.textContent = areLinksVisible ? 'LINKS: ON' : 'LINKS: OFF';
    });

    // Assign a loaded audio File to a specific channel record
    function assignAudioFileToChannel(rec, file, autoPlay = false) {
      if (!file || !rec) return;
      const prev = loadedAudioByChannel.get(rec.chNum);
      if (prev && prev.url) URL.revokeObjectURL(prev.url);

      const blobUrl = URL.createObjectURL(file);
      loadedAudioByChannel.set(rec.chNum, { url: blobUrl, name: file.name });

      rec.pin.dataset.audio = blobUrl;
      rec.pin.dataset.info = `CH${rec.chNum} · ${file.name.toUpperCase()}`;
      rec.channelSubEl.textContent = file.name;
      rec.channelCard.classList.add('has-audio');
      if (!rec.pin.classList.contains('active')) {
        rec.channelStateEl.textContent = 'READY';
      }

      if (autoPlay) {
        if (rec.pin.classList.contains('active')) {
          rec.pin.classList.remove('active');
        }
        activateChannel(rec);
      } else {
        statusReadout.textContent = `LOADED CH${rec.chNum} AUDIO: ${file.name.toUpperCase()}`;
      }
    }

    // Batch load multiple audio files into CH1, CH2, CH3...
    uploadBatchAudioInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length || !stemRecords.length) return;

      files.forEach((file, i) => {
        // Match by CH<number> in filename if present (e.g. ch2_track.mp3), otherwise assign sequentially
        const nameMatch = file.name.match(/ch[_-\s]*0*(\d+)/i);
        let targetRec = null;
        if (nameMatch) {
          const targetCh = parseInt(nameMatch[1], 10);
          targetRec = stemRecords.find((r) => r.chNum === targetCh);
        }
        if (!targetRec && i < stemRecords.length) {
          targetRec = stemRecords[i];
        }
        if (targetRec) {
          assignAudioFileToChannel(targetRec, file, i === 0 && files.length === 1);
        }
      });
      e.target.value = '';
    });

    // 2. Unified Activation & Hover Sync between Top-Left Audio Channel Cards and 3D Hotspots
    function setChannelHover(rec, isHovering) {
      if (isHovering) {
        rec.stemGroup.classList.add('active');
        rec.channelCard.classList.add('hover-link');
      } else if (!rec.pin.classList.contains('active')) {
        rec.stemGroup.classList.remove('active');
        rec.channelCard.classList.remove('hover-link');
      }
    }

    function activateChannel(rec) {
      const isAlreadyActive = rec.pin.classList.contains('active');
      hotspots.forEach((p) => p.classList.remove('active'));
      stemRecords.forEach((r) => {
        r.stemGroup.classList.remove('active');
        r.channelCard.classList.remove('active');
        r.channelStateEl.textContent = loadedAudioByChannel.has(r.chNum) ? 'READY' : 'IDLE';
      });

      if (isAlreadyActive) {
        stopAudioStream();
        return;
      }

      rec.pin.classList.add('active');
      rec.stemGroup.classList.add('active');
      rec.channelCard.classList.add('active');
      rec.channelStateEl.textContent = 'LIVE';

      mvMap.cameraTarget = rec.pin.dataset.position;
      audioEngine.src = rec.pin.dataset.audio;
      audioEngine.currentTime = 0;
      audioEngine.play().catch(() => {
        statusReadout.textContent = `${rec.pin.dataset.info} (CLICK 'LOAD' ON CH${rec.chNum} TO ATTACH AUDIO)`;
      });
      statusReadout.textContent = rec.pin.dataset.info;
      stopAudioBtn.style.display = 'inline-block';

      // Accelerate ring rotation subtly while an acoustic channel is auditioning
      mvRing.setAttribute('rotation-per-second', '36deg');
    }

    function bindChannelAndHotspotEvents(rec) {
      rec.pin.addEventListener('mouseenter', () => setChannelHover(rec, true));
      rec.pin.addEventListener('mouseleave', () => setChannelHover(rec, false));
      rec.pin.addEventListener('click', () => activateChannel(rec));

      rec.channelCard.addEventListener('mouseenter', () => setChannelHover(rec, true));
      rec.channelCard.addEventListener('mouseleave', () => setChannelHover(rec, false));
      rec.channelCard.addEventListener('click', () => activateChannel(rec));

      // Per-channel file input to load & immediately reproduce audio
      if (rec.channelLoadBtnEl && rec.channelFileInputEl) {
        rec.channelLoadBtnEl.addEventListener('click', (e) => {
          e.stopPropagation();
        });
        rec.channelFileInputEl.addEventListener('click', (e) => {
          e.stopPropagation();
        });
        rec.channelFileInputEl.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            assignAudioFileToChannel(rec, file, true);
          }
          e.target.value = '';
        });
      }

      // Drag-and-drop audio file directly onto a channel button
      rec.channelCard.addEventListener('dragover', (e) => {
        e.preventDefault();
        setChannelHover(rec, true);
      });
      rec.channelCard.addEventListener('dragleave', () => {
        setChannelHover(rec, false);
      });
      rec.channelCard.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) {
          assignAudioFileToChannel(rec, file, true);
        }
      });

      // Clicking the right-edge port dot toggles visibility of this individual channel's hotspot connection line
      if (rec.channelPortEl) {
        rec.channelPortEl.addEventListener('click', (e) => {
          e.stopPropagation();
          const hidden = rec.stemGroup.classList.toggle('wire-hidden');
          rec.channelCard.classList.toggle('wire-hidden', hidden);
        });
      }
    }

    // 3. Dynamically count & build hotspots + HUD audio channel cards + animated SVG lines from CH# meshes in .glb
    function syncHotspotsFromGLB() {
      stopAudioStream();

      // Remove any previously generated hotspot buttons, base anchors, HUD cards, and SVG stem lines
      mvMap.querySelectorAll('.hotspot, .hotspot-base-anchor').forEach((el) => el.remove());
      linesSvg.innerHTML = '';
      channelsHudList.innerHTML = '';
      hotspots = [];
      stemRecords = [];

      // Access <model-viewer>'s internal Three.js scene instance
      const sceneSymbol = Object.getOwnPropertySymbols(mvMap).find(
        (sym) => sym.description === 'scene'
      );
      const scene = sceneSymbol ? mvMap[sceneSymbol] : null;
      if (!scene) return;

      scene.updateMatrixWorld(true);

      // Discover all triangular anchor meshes named with channel number (e.g. CH1, CH2, CH03, CH4_mesh)
      const chRegex = /^CH[_-\s]*0*(\d+)/i;
      const seenChannels = new Map();
      const seenMeshes = new Set();

      // Also track overall city ground elevation in target space for stem base calculation
      let cityMinY = Infinity;
      let cityMaxY = -Infinity;

      scene.traverse((obj) => {
        if (obj.geometry) {
          obj.geometry.computeBoundingBox();
          const bb = obj.geometry.boundingBox;
          if (bb) {
            const minPt = bb.min.clone();
            const maxPt = bb.max.clone();
            obj.localToWorld(minPt);
            obj.localToWorld(maxPt);
            if (scene.target && typeof scene.target.worldToLocal === 'function') {
              scene.target.worldToLocal(minPt);
              scene.target.worldToLocal(maxPt);
            }
            if (minPt.y < cityMinY) cityMinY = minPt.y;
            if (maxPt.y > cityMaxY) cityMaxY = maxPt.y;
          }
        }

        if (!obj.name) return;
        const match = obj.name.trim().match(chRegex);
        if (!match) return;

        const chNum = parseInt(match[1], 10);
        if (seenChannels.has(chNum)) return;

        // Resolve triangular mesh geometry on this node or its first mesh descendant
        let meshObj = obj.geometry ? obj : null;
        if (!meshObj) {
          obj.traverse((child) => {
            if (!meshObj && child.geometry) meshObj = child;
          });
        }

        if (meshObj && !seenMeshes.has(meshObj.uuid)) {
          seenMeshes.add(meshObj.uuid);
          seenChannels.set(chNum, { chNum, anchorObj: obj, meshObj });
        }
      });

      if (!isFinite(cityMinY)) cityMinY = 0;

      // Sort discovered channel anchors numerically (CH1, CH2, CH3, ...)
      const anchors = Array.from(seenChannels.values()).sort((a, b) => a.chNum - b.chNum);
      channelsCountBadge.textContent = `${anchors.length} CH`;

      anchors.forEach(({ chNum, anchorObj, meshObj }, idx) => {
        const topPos = anchorObj.getWorldPosition(new anchorObj.position.constructor());
        if (meshObj && meshObj.geometry) {
          meshObj.geometry.computeBoundingBox();
          meshObj.geometry.boundingBox.getCenter(topPos);
          meshObj.localToWorld(topPos);
        }
        // Convert from Three.js world space into <model-viewer>'s target/hotspot root space
        if (scene.target && typeof scene.target.worldToLocal === 'function') {
          scene.target.worldToLocal(topPos);
        }

        // Base of the vertical positioning line directly beneath the hotspot on the street plane
        const baseY = cityMinY;
        const basePos = topPos.clone();
        basePos.y = baseY;

        const topPosStr = `${topPos.x.toFixed(5)}m ${topPos.y.toFixed(5)}m ${topPos.z.toFixed(5)}m`;
        const basePosStr = `${basePos.x.toFixed(5)}m ${basePos.y.toFixed(5)}m ${basePos.z.toFixed(5)}m`;

        const slotName = `hotspot-${chNum}`;
        const baseSlotName = `hotspot-base-${chNum}`;
        const label = `CH${chNum}`;
        const paddedNum = String(chNum).padStart(2, '0');
        const loadedAudio = loadedAudioByChannel.get(chNum);
        const defaultAudioPath = teamParam
          ? `assets/teams/${teamParam}/ch${chNum}.mp3`
          : `assets/audio/ch${chNum}.mp3`;
        const audioPath = loadedAudio ? loadedAudio.url : defaultAudioPath;
        const subText = loadedAudio ? loadedAudio.name : `ch${chNum}.mp3 · SPATIAL NODE`;
        const infoText = loadedAudio
          ? `${label} · ${loadedAudio.name.toUpperCase()}`
          : `${label} · URBAN ACOUSTIC STREAM ${paddedNum}`;

        // 1. Create the top interactive 3D hotspot button
        const pin = document.createElement('button');
        pin.className = 'hotspot';
        pin.setAttribute('slot', slotName);
        pin.dataset.position = topPosStr;
        pin.dataset.normal = '0m 1m 0m';
        pin.dataset.audio = audioPath;
        pin.dataset.info = infoText;
        pin.innerHTML = `<span class="pulse-dot"></span> ${label}`;

        // 2. Create the hidden ground-level 3D anchor at the bottom of the vertical stem line
        const baseAnchor = document.createElement('div');
        baseAnchor.className = 'hotspot-base-anchor';
        baseAnchor.setAttribute('slot', baseSlotName);
        baseAnchor.dataset.position = basePosStr;
        baseAnchor.dataset.normal = '0m 1m 0m';

        // 3. Create the Top-Left Audio Channel Card in #channels-hud-list
        const channelCard = document.createElement('div');
        channelCard.className = loadedAudio ? 'channel-card has-audio' : 'channel-card';
        channelCard.innerHTML = `
          <div class="channel-left">
            <span class="channel-dot"></span>
            <div class="channel-meta">
              <span class="channel-name">${label} · STREAM ${paddedNum}</span>
              <span class="channel-sub">${subText}</span>
            </div>
          </div>
          <div class="channel-right">
            <label class="channel-load-btn" title="Load audio file (.mp3, .wav) for ${label}">
              LOAD
              <input type="file" class="channel-file-input" accept="audio/*" />
            </label>
            <div class="channel-eq">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </div>
            <span class="channel-state">${loadedAudio ? 'READY' : 'IDLE'}</span>
          </div>
          <span class="channel-port" title="Click to toggle ${label} hotspot connection wire"></span>
        `;
        const channelPortEl = channelCard.querySelector('.channel-port');
        const channelStateEl = channelCard.querySelector('.channel-state');
        const channelSubEl = channelCard.querySelector('.channel-sub');
        const channelLoadBtnEl = channelCard.querySelector('.channel-load-btn');
        const channelFileInputEl = channelCard.querySelector('.channel-file-input');
        channelsHudList.appendChild(channelCard);

        // 4. Create the animated SVG vertical stem + HUD-to-Hotspot connector wire elements
        const stemGroup = document.createElementNS(SVG_NS, 'g');
        stemGroup.setAttribute('class', 'stem-group');

        const hudWireTrack = document.createElementNS(SVG_NS, 'path');
        hudWireTrack.setAttribute('class', 'hud-wire-track');

        const hudWireFlow = document.createElementNS(SVG_NS, 'path');
        hudWireFlow.setAttribute('class', 'hud-wire-flow');

        const baseRing = document.createElementNS(SVG_NS, 'circle');
        baseRing.setAttribute('class', 'stem-base-ring');
        baseRing.setAttribute('r', '5');

        const baseDot = document.createElementNS(SVG_NS, 'circle');
        baseDot.setAttribute('class', 'stem-base-dot');
        baseDot.setAttribute('r', '2.5');

        const trackLine = document.createElementNS(SVG_NS, 'line');
        trackLine.setAttribute('class', 'stem-track');

        const flowLine = document.createElementNS(SVG_NS, 'line');
        flowLine.setAttribute('class', 'stem-flow');

        const packetDot = document.createElementNS(SVG_NS, 'circle');
        packetDot.setAttribute('class', 'stem-packet');
        packetDot.setAttribute('r', '2.4');

        stemGroup.appendChild(hudWireTrack);
        stemGroup.appendChild(hudWireFlow);
        stemGroup.appendChild(baseRing);
        stemGroup.appendChild(trackLine);
        stemGroup.appendChild(flowLine);
        stemGroup.appendChild(packetDot);
        stemGroup.appendChild(baseDot);
        linesSvg.appendChild(stemGroup);

        mvMap.appendChild(pin);
        mvMap.appendChild(baseAnchor);

        mvMap.updateHotspot({
          name: slotName,
          position: basePosStr,
          normal: '0m 1m 0m'
        });
        mvMap.updateHotspot({
          name: baseSlotName,
          position: basePosStr,
          normal: '0m 1m 0m'
        });

        const rec = {
          chNum,
          idx,
          slotName,
          baseSlotName,
          topPos,
          basePos,
          pin,
          channelCard,
          channelPortEl,
          channelStateEl,
          channelSubEl,
          channelLoadBtnEl,
          channelFileInputEl,
          stemGroup,
          hudWireTrack,
          hudWireFlow,
          trackLine,
          flowLine,
          packetDot,
          baseDot,
          baseRing,
          deployed: false
        };

        bindChannelAndHotspotEvents(rec);
        hotspots.push(pin);
        stemRecords.push(rec);
      });

      if (anchors.length > 0) {
        const rangeLabel = anchors.length === 1
          ? `CH${anchors[0].chNum}`
          : `CH${anchors[0].chNum}–CH${anchors[anchors.length - 1].chNum}`;
        defaultIdleText = `DRAG TO ORBIT · CLICK ${rangeLabel} PIN (${anchors.length} CHANNELS) TO AUDITION STREAM`;
      } else {
        defaultIdleText = 'DRAG TO ORBIT · NO CH# ANCHOR MESHES DETECTED IN .GLB';
      }
      statusReadout.textContent = defaultIdleText;

      loadStartTime = performance.now();
      startStemAnimationLoop();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function startStemAnimationLoop() {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      function tick(now) {
        const elapsed = now - loadStartTime;
        const mapRect = mvMap.getBoundingClientRect();

        stemRecords.forEach((rec) => {
          // 1. Entrance growth animation: extend vertical line from street base up to 3D hotspot anchor
          const delay = rec.idx * 160;
          const duration = 1100;
          const rawT = Math.max(0, Math.min(1, (elapsed - delay) / duration));
          const growT = easeOutCubic(rawT);

          if (!rec.deployed) {
            const curY = rec.basePos.y + (rec.topPos.y - rec.basePos.y) * growT;
            const curPosStr = `${rec.topPos.x.toFixed(5)}m ${curY.toFixed(5)}m ${rec.topPos.z.toFixed(5)}m`;
            mvMap.updateHotspot({
              name: rec.slotName,
              position: curPosStr,
              normal: '0m 1m 0m'
            });
            if (rawT >= 1) {
              rec.deployed = true;
              rec.pin.dataset.position = curPosStr;
            }
          }

          // 2. Query 2D screen-space canvas coordinates of both 3D endpoints from <model-viewer>
          const topSpot = typeof mvMap.queryHotspot === 'function' ? mvMap.queryHotspot(rec.slotName) : null;
          const baseSpot = typeof mvMap.queryHotspot === 'function' ? mvMap.queryHotspot(rec.baseSlotName) : null;

          if (!topSpot || !baseSpot || !topSpot.canvasPosition || !baseSpot.canvasPosition) {
            return;
          }

          const x1 = baseSpot.canvasPosition.x;
          const y1 = baseSpot.canvasPosition.y;
          const x2 = topSpot.canvasPosition.x;
          // Connect neatly to the bottom edge of the hotspot pill (+11px below pill center)
          const y2 = Math.min(y1, topSpot.canvasPosition.y + 11);

          rec.trackLine.setAttribute('x1', x1);
          rec.trackLine.setAttribute('y1', y1);
          rec.trackLine.setAttribute('x2', x2);
          rec.trackLine.setAttribute('y2', y2);

          rec.flowLine.setAttribute('x1', x1);
          rec.flowLine.setAttribute('y1', y1);
          rec.flowLine.setAttribute('x2', x2);
          rec.flowLine.setAttribute('y2', y2);

          rec.baseDot.setAttribute('cx', x1);
          rec.baseDot.setAttribute('cy', y1);

          // 3. Update SVG Connector Wire from Top-Left HUD Channel Card port to 3D Hotspot pill
          if (rec.channelPortEl && mapRect.width > 0) {
            const portRect = rec.channelPortEl.getBoundingClientRect();
            const portX = portRect.left + portRect.width / 2 - mapRect.left;
            const portY = portRect.top + portRect.height / 2 - mapRect.top;

            // Attach to left edge of the 3D hotspot pill
            const pillHalfW = (rec.pin.offsetWidth || 54) / 2;
            const targetX = topSpot.canvasPosition.x - pillHalfW;
            const targetY = topSpot.canvasPosition.y;
            const ctrlOffset = Math.max(45, Math.abs(targetX - portX) * 0.42);
            const curveD = `M ${portX.toFixed(1)} ${portY.toFixed(1)} C ${(portX + ctrlOffset).toFixed(1)} ${portY.toFixed(1)}, ${(targetX - ctrlOffset).toFixed(1)} ${targetY.toFixed(1)}, ${targetX.toFixed(1)} ${targetY.toFixed(1)}`;

            rec.hudWireTrack.setAttribute('d', curveD);
            rec.hudWireFlow.setAttribute('d', curveD);
          }

          // 4. Animate traveling signal packet moving up the line from street base (x1,y1) to hotspot (x2,y2)
          const isActive = rec.stemGroup.classList.contains('active');
          const speed = isActive ? 0.0014 : 0.00065;
          const phase = (now * speed + rec.idx * 0.31) % 1;
          const px = x1 + (x2 - x1) * phase;
          const py = y1 + (y2 - y1) * phase;
          rec.packetDot.setAttribute('cx', px);
          rec.packetDot.setAttribute('cy', py);

          // 5. Animate street-level sonar ring pulse
          const ringPhase = (now * (isActive ? 0.0016 : 0.0008) + rec.idx * 0.25) % 1;
          const ringRadius = 3 + ringPhase * (isActive ? 14 : 8);
          rec.baseRing.setAttribute('cx', x1);
          rec.baseRing.setAttribute('cy', y1);
          rec.baseRing.setAttribute('r', ringRadius.toFixed(1));
          rec.baseRing.setAttribute('style', `opacity: ${(1 - ringPhase) * (isActive ? 0.9 : 0.55)}`);
        });

        animFrameId = requestAnimationFrame(tick);
      }

      animFrameId = requestAnimationFrame(tick);
    }

    mvMap.addEventListener('load', syncHotspotsFromGLB);

    function stopAudioStream() {
      audioEngine.pause();
      audioEngine.currentTime = 0;
      hotspots.forEach((p) => p.classList.remove('active'));
      stemRecords.forEach((r) => {
        r.stemGroup.classList.remove('active');
        r.channelCard.classList.remove('active');
        r.channelStateEl.textContent = loadedAudioByChannel.has(r.chNum) ? 'READY' : 'IDLE';
      });
      statusReadout.textContent = defaultIdleText;
      stopAudioBtn.style.display = 'none';
      mvRing.setAttribute('rotation-per-second', '18deg');
    }

    stopAudioBtn.addEventListener('click', stopAudioStream);
    audioEngine.addEventListener('ended', stopAudioStream);

    // 3. Reset Map Camera Orbit
    document.getElementById('reset-map-cam').addEventListener('click', () => {
      mvMap.cameraTarget = 'auto auto auto';
      mvMap.cameraOrbit = '35deg 58deg 105%';
    });

    // 4. Client-Side Local .GLB Preview Loader (For Student Testing Before Git Push)
    document.getElementById('upload-map-glb').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        mvMap.src = URL.createObjectURL(file);
        statusReadout.textContent = `LOCAL PREVIEW: ${file.name.toUpperCase()}`;
      }
    });

    document.getElementById('upload-ring-glb').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        mvRing.src = URL.createObjectURL(file);
      }
    });
  </script>
</body>
